name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Unit tests are hardware-free by design: the DDC surface sits behind the
  # `Vcp` trait, so discovery logic is exercised against recorded capability
  # strings rather than a real monitor.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all
      - name: Build release
        run: cargo build --release

  # install.sh runs privileged commands on a user's machine, so it gets linted
  # and exercised rather than trusted.
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt \
            koalaman/shellcheck:stable install.sh
      - name: Dry run changes nothing
        run: |
          sudo cp -a /etc/udev/rules.d /tmp/udev-before
          NO_COLOR=1 ./install.sh --dry-run --no-build
          sudo diff -r /tmp/udev-before /etc/udev/rules.d
      - name: Real run, then prove it is idempotent
        run: |
          NO_COLOR=1 ./install.sh --no-build
          test -f /etc/modules-load.d/i2c-dev.conf
          test -f /etc/udev/rules.d/60-hotseat-i2c.rules
          # A second run must report skips, not repeat the work.
          NO_COLOR=1 ./install.sh --no-build | tee /tmp/second.log
          grep -q 'skip' /tmp/second.log

  # Static binaries for release. musl so they run on any distro with nothing
  # installed; ddc-i2c has no C dependencies, so this needs no cross toolchain
  # beyond musl-tools.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, installer]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          fi
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Confirm it is actually static
        run: |
          file target/${{ matrix.target }}/release/hotseat
          # A dynamically linked binary here would defeat the point.
          ! ldd target/${{ matrix.target }}/release/hotseat 2>/dev/null | grep -q '=>'
      - uses: actions/upload-artifact@v4
        with:
          name: hotseat-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/hotseat
