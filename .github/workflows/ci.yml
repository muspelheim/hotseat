name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Unit tests are hardware-free by design: the DDC surface sits behind the
  # `Vcp` trait, so discovery logic is exercised against recorded capability
  # strings rather than a real monitor.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all
      - name: Build release
        run: cargo build --release

  # install.sh runs privileged commands on a user's machine, so it gets linted
  # and exercised rather than trusted.
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt \
            koalaman/shellcheck:stable install.sh
      - name: Dry run changes nothing
        run: |
          sudo cp -a /etc/udev/rules.d /tmp/udev-before
          NO_COLOR=1 ./install.sh --dry-run --no-build
          sudo diff -r /tmp/udev-before /etc/udev/rules.d
      - name: Real run, then prove it is idempotent
        run: |
          NO_COLOR=1 ./install.sh --no-build
          test -f /etc/modules-load.d/i2c-dev.conf
          test -f /etc/udev/rules.d/60-hotseat-i2c.rules
          # A second run must report skips, not repeat the work.
          NO_COLOR=1 ./install.sh --no-build | tee /tmp/second.log
          grep -q 'skip' /tmp/second.log

  # Build inside a CLEAN container, not on the runner.
  #
  # This job exists because `test` above passed green while a freshly installed
  # Ubuntu machine failed outright. GitHub's runner images already ship
  # pkg-config and libudev-dev, which hid the fact that hotseat needs them:
  # ddc-hi reaches libudev via ddc-i2c -> i2c-linux -> udev -> libudev-sys, and
  # the failure is a bare pkg-config error that never mentions udev.
  #
  # Only a clean image proves install.sh is sufficient by itself.
  clean-machine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Truncated downloads must do nothing
        run: |
          # The property that makes `curl | bash` acceptable: a partial
          # transfer defines functions and never reaches main.
          for frac in 30 60 90; do
            lines=$(( $(wc -l < install.sh) * frac / 100 ))
            head -n "$lines" install.sh > /tmp/trunc.sh
            if bash /tmp/trunc.sh >/dev/null 2>&1; then
              echo "FAIL: script truncated at ${frac}% still ran to completion"
              exit 1
            fi
          done
      - name: Piped install must succeed on a bare image
        run: |
          # Deliberately harsh: no git, no curl, no gcc, no pkg-config. Only
          # sudo and ca-certificates, as a real minimal install would have.
          # The script is piped through stdin, exactly as curl | bash does it.
          docker run --rm -i -v "$PWD/install.sh:/tmp/i.sh:ro" ubuntu:24.04 bash -euc '
            apt-get update -qq
            apt-get install -y -qq sudo ca-certificates >/dev/null
            useradd -m -s /bin/bash user
            echo "user ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/user
            su user -c "cd ~ && NO_COLOR=1 bash /tmp/i.sh"
            su user -c "~/.local/bin/hotseat --version"
          '

  # Release binaries for Linux are glibc, not musl.
  #
  # An earlier version of this job built static musl binaries and asserted they
  # had no dynamic dependencies. That was wrong: libudev is a system library
  # that does not static-link cleanly under musl, and hotseat cannot avoid it,
  # because ddc-hi enables ddc-i2c's udev-based enumeration unconditionally and
  # Cargo features are additive, so it cannot be switched off downstream. The
  # honest position is a dynamically linked build plus a stated requirement.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, installer, clean-machine]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev
          cargo build --release
      - name: Record what it actually links against
        run: |
          file target/release/hotseat
          ldd target/release/hotseat
          # Fail loudly if libudev ever stops being a runtime requirement, so
          # the docs and the comment above cannot silently go stale.
          ldd target/release/hotseat | grep -q libudev
      - uses: actions/upload-artifact@v4
        with:
          name: hotseat-x86_64-unknown-linux-gnu
          path: target/release/hotseat
